[project]
name = "aletheia"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "greenlet>=3.0.0",
    # Queue (ARQ = async-native Redis job queue)
    "arq>=0.26.0",
    "redis[hiredis]>=5.0.0",
    # AI
    "google-genai>=0.1.0",
    # HTTP client
    "httpx>=0.27.0",
    # Settings & validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # Retries
    "tenacity>=9.0.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
