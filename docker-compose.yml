# ALETHEIA Full Stack Containerization

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aletheia_pgvector
    environment:
      POSTGRES_USER: aletheia_user
      POSTGRES_PASSWORD: aletheia_password
      POSTGRES_DB: aletheia_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia_user -d aletheia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aletheia_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://aletheia_user:aletheia_password@postgres:5432/aletheia_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ENVIRONMENT=production
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: aletheia_frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  pgdata:
